[project]
name = "robot-ai-experiment"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
    "lerobot",
    "lerobot[dataset]",
    "lerobot[feetech]",
    "lerobot[diffusion]",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "matplotlib>=3.11.2",
    "ipykernel>=6.31.0",
]

[tool.uv.workspace]
members = [
    "lerobot",
]

[tool.uv.sources]
lerobot = { workspace = true }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
